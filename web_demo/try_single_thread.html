<!doctype html>
<html>
<head><meta charset="utf-8"><title>Single Thread Test</title></head>
<body>
<h1>ORT with Single Thread (Firefox)</h1>
<p>Testing ONNX Runtime with numThreads=1 (no SharedArrayBuffer needed)</p>
<pre id="log"></pre>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.14.0/dist/ort.min.js"></script>
<script>
const log = m => { document.getElementById('log').textContent += m + '\n'; console.log(m); };

log('SharedArrayBuffer: ' + (typeof SharedArrayBuffer));
log('Configuring ORT numThreads=1...');

// MUST set this BEFORE creating session
ort.env.wasm = { numThreads: 1, simd: false };

ort.InferenceSession.create('models/model.onnx')
  .then(s => {
    log('✅ SUCCESS! Model loaded in single-threaded mode!');
    log('Inputs: ' + JSON.stringify(s.inputNames));
  })
  .catch(e => {
    log('❌ FAILED: ' + e.message);
    log('Error code: ' + (e.status || typeof e));
  });
</script>
</body>
</html>
