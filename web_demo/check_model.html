<!doctype html>
<html>
<head><meta charset="utf-8"><title>Model Check</title></head>
<body>
<h1>Model Validator</h1>
<pre id="log"></pre>

<script>
const log = (m, val) => {
  const line = m + (val !== undefined ? ': ' + JSON.stringify(val) : '');
  document.getElementById('log').textContent += line + '\n';
  console.log(line);
};

log('Fetching model file...');
fetch('models/model.onnx')
  .then(r => {
    log('Status', r.status);
    return r.arrayBuffer();
  })
  .then(buf => {
    log('Size (bytes)', buf.byteLength);

    // Check ONNX magic header
    const header = new Uint8Array(buf.slice(0, 8));
    log('First 8 bytes (hex)', Array.from(header).map(b => b.toString(16).padStart(2,'0')).join(' '));
    log('Valid ONNX format (0x08 0x0A)', header[0] === 0x08 && header[1] === 0x0A);

    // Check for pytorch
    const view = new TextDecoder().decode(new Uint8Array(buf));
    log('Contains "pytorch"', view.includes('pytorch'));
    log('Contains "onnx"', view.includes('onnx'));
  })
  .catch(e => log('Fetch failed', e.message));
</script>
</body>
</html>
