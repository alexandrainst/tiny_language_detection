<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ONNX Runtime Test</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, monospace; padding: 20px; background: #1a1a2e; color: #eee; }
    h1 { color: #00ff88; }
    .success { color: #00ff88; font-weight: bold; }
    .error { color: #ff4444; }
    .info { color: #88ccff; }
    pre { background: #2a2a3e; padding: 15px; border-radius: 8px; overflow-x: auto; }
    #output { margin-top: 20px; }
  </style>
</head>
<body>
<h1>🧪 ONNX Runtime Web Test</h1>
<p>Testing local ORT library and model loading...</p>
<div id="output"></div>

<script src="ort.all.js"></script>
<script>
const output = document.getElementById('output');

function log(msg, type = 'info') {
  console.log(msg);
  const div = document.createElement('div');
  div.className = type;
  div.textContent = '> ' + msg;
  div.style.marginBottom = '5px';
  output.appendChild(div);
}

async function test() {
  // Check ORT loaded
  if (typeof ort === 'undefined') {
    log('❌ FATAL: ort object is undefined!', 'error');
    log('  ort.min.js failed to load from local server', 'error');
    return;
  }

  log('✅ ort object exists', 'success');
  log('  ort.version = ' + (ort.version || 'undefined'), 'info');

  // Configure for bundled WASM (ort.all.js has it inline)
  ort.env.wasm = ort.env.wasm || {};
  ort.env.wasm.wasmPaths = null; // Force use of bundled WASM
  ort.env.wasm.numThreads = 4;
  ort.env.wasm.simd = true;

  log('Using bundled WASM (wasmPaths = null)', 'info');

  try {
    log('Creating inference session...', 'info');

    // Create session with explicit options
    const session = await ort.InferenceSession.create('models/model.onnx');

    log('✅ SUCCESS! Model loaded', 'success');
    log('  Input names: ' + JSON.stringify(session.inputNames), 'info');
    log('  Output names: ' + JSON.stringify(session.outputNames), 'info');

    // Test inference
    log('Running test inference...', 'info');
    const inputData = new Float32Array(1 * 1 * 80 * 100).fill(0.1);
    const inputTensor = new ort.Tensor('float32', inputData, [1, 1, 80, 100]);
    const feeds = { input: inputTensor };

    const results = await session.run(feeds);
    log('✅ Inference successful!', 'success');
    log('  Output tensor shape: [' + results.output.dims.join(', ') + ']', 'info');
    log('  Output values (first 5): [' + Array.from(results.output.data).slice(0, 5).map(x => x.toFixed(4)).join(', ') + ']', 'info');

    // Final result
    const finalDiv = document.createElement('div');
    finalDiv.style.marginTop = '20px';
    finalDiv.style.padding = '15px';
    finalDiv.style.background = '#00ff8822';
    finalDiv.style.borderRadius = '8px';
    finalDiv.innerHTML = '<strong style="color: #00ff88; font-size: 1.2em;">✅ All tests passed! Model is ready.</strong>';
    output.appendChild(finalDiv);

  } catch (err) {
    log('❌ FAILED: ' + (err.message || 'Unknown error'), 'error');
    if (err.stack) {
      const pre = document.createElement('pre');
      pre.textContent = err.stack;
      pre.style.fontSize = '11px';
      output.appendChild(pre);
    }

    // Debug info
    log('', 'info');
    log('Debug info:', 'info');
    log('  ort.env.backend = ' + (ort.env?.backend || 'undefined'), 'info');
    log('  ort.env.wasm = ' + JSON.stringify(ort.env?.wasm || {}), 'info');
  }
}

// Run test when page loads
test();
</script>
</body>
</html>
