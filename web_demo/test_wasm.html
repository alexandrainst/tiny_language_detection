<!doctype html>
<html>
<head><meta charset="utf-8"><title>WASM Test</title></head>
<body>
<h1>Firefox WASM Test</h1>
<pre id="log"></pre>
<script>
const log = m => { document.getElementById('log').textContent += m + '\n'; console.log(m); };

// Check Firefox WASM support
log('Browser: ' + navigator.userAgent.split(')').pop());
log('SharedArrayBuffer: ' + (typeof SharedArrayBuffer !== 'undefined' ? '✓' : '✗ BLOCKED'));
log('Atomics: ' + (typeof Atomics !== 'undefined' ? '✓' : '✗ BLOCKED'));
log('WebAssembly: ' + (typeof WebAssembly !== 'undefined' ? '✓' : '✗ BLOCKED'));

// Try compiling simple WASM
const wasmCode = new Uint8Array([
  0x00, 0x61, 0x73, 0x6d, // magic
  0x01, 0x00, 0x00, 0x00, // version
  0x01, 0x07, 0x01,       // type section
  0x60, 0x00, 0x01, 0x7f, // func type: () -> i32
  0x03, 0x02, 0x01, 0x00, // function section
  0x07, 0x07, 0x01,       // export section
  0x01, 0x04, 0x74, 0x65, 0x73, 0x74, 0x00, 0x00,
  0x0a, 0x09, 0x01,       // code section
  0x07, 0x00, 0x41, 0x2a, 0x0b  // func body: return 42
]);

log('\\nCompiling WASM...');
WebAssembly.compile(wasmCode)
  .then(m => {
    log('✓ WASM compiles OK');
    return WebAssembly.instantiate(m);
  })
  .then(i => {
    log('✓ WASM instantiates OK, test() = ' + i.exports.test());
    log('\\n✅ WASM works in Firefox!');
    log('\\nThe ONNX Runtime issue is something else.');
  })
  .catch(e => {
    log('✗ WASM failed: ' + e.message);
    log('\\n❌ WASM is broken in this Firefox');
  });
</script>
</body>
</html>
