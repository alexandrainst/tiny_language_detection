<!doctype html>
<html>
<head><meta charset="utf-8"><title>Debug</title></head>
<body>
<h1>Debug ORT</h1>
<pre id="log"></pre>

<!-- Try different ORT versions -->
<script>
const log = m => { console.log(m); document.getElementById('log').textContent += m+'\n'; };

log('Loading ORT 1.14.0...');
</script>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.14.0/dist/ort.min.js"></script>
<script>
log('ORT loaded: ' + typeof ort);
if (typeof ort === 'object') {
  log('Creating session from CDN...');
  ort.InferenceSession.create('models/model.onnx')
    .then(s => log('✅ CDN SUCCESS: ' + JSON.stringify(s.inputNames)))
    .catch(e => log('❌ CDN FAILED: ' + (e.message || e)));
} else {
  log('ORT failed to load from CDN');
}
</script>
</body>
</html>
